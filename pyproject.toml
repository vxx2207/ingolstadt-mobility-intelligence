[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingomob"
version = "2.0.0"
description = "Reproducible open-data analytics, demand forecasting and BI for urban mobility in Ingolstadt."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Velat"}]
keywords = ["open-data", "mobility", "data-engineering", "machine-learning", "duckdb", "gtfs", "smart-city", "dach"]
dependencies = [
  "duckdb>=1.0,<2.0",
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.3,<2.0",
  "pyarrow>=14,<26.0",
  "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
ingomob = "ingomob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:ingomob.*"]
