<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IngoMobility · Ingolstadt Open Mobility Intelligence</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root{
    --bg:#0d1425; --panel:#131e35; --card:#16233f; --card2:#1b2a49; --line:#26364f;
    --ink:#e9eefb; --muted:#93a4c4; --dim:#6d7f9e;
    --blue:#3b82f6; --green:#10b981; --red:#ef4444; --amber:#f59e0b; --violet:#8b5cf6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px}

  header{padding:20px 24px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
        max-width:1280px;margin:0 auto}
  .brand{font-size:21px;font-weight:700;letter-spacing:.2px;margin:0}
  .brand span{color:var(--blue)}
  .tagline{color:var(--muted);font-size:13.5px;margin-top:3px;max-width:620px}
  .provenance{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;
              max-width:1280px;margin-left:auto;margin-right:auto}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);
        border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;
        color:var(--muted);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  .chip.warn{border-color:#7a5a1e;background:#2b2110;color:#f5d9a4}
  .chip.good{border-color:#1c5741;background:#10241c;color:#9ae6c4}

  /* language switch */
  .langswitch{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
              background:var(--card);flex:0 0 auto}
  .langswitch button{background:transparent;color:var(--muted);border:0;padding:7px 13px;
      font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.3px}
  .langswitch button:hover{color:var(--ink)}
  .langswitch button[aria-pressed="true"]{background:var(--blue);color:#fff}

  .wrap{padding:20px 24px 40px;max-width:1280px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
       padding:13px 15px;position:relative}
  .kpi .v{font-size:25px;font-weight:700;line-height:1.15}
  .kpi .v small{font-size:14px;font-weight:600;color:var(--muted)}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:3px;display:flex;align-items:center;gap:5px}
  .kpi .v.blue{color:#7fb0ff}.kpi .v.green{color:#5fd6a8}.kpi .v.amber{color:#f7c069}
  .info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
        border-radius:50%;border:1px solid var(--dim);color:var(--dim);font-size:9.5px;
        cursor:help;flex:0 0 auto;font-weight:700}
  .kpi:hover .info{border-color:var(--blue);color:var(--blue)}
  [data-tip]{position:relative}
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:0;
      background:#0a1120;color:var(--ink);border:1px solid var(--line);border-radius:9px;
      padding:9px 11px;font-size:12px;line-height:1.45;width:265px;z-index:60;
      box-shadow:0 10px 26px rgba(0,0,0,.5);white-space:normal;font-weight:400}

  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 12px;border-bottom:1px solid var(--line);
           padding-bottom:12px}
  nav.tabs button{background:var(--card);color:var(--muted);border:1px solid var(--line);
      padding:8px 15px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;
      font-family:inherit}
  nav.tabs button:hover{color:var(--ink);border-color:var(--dim)}
  nav.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:var(--card);
           border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;margin-bottom:16px}
  .fgroup{display:flex;flex-direction:column;gap:5px}
  .fgroup label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
                font-weight:600}
  select,button.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);
      border-radius:8px;padding:7px 11px;font-size:13.5px;font-family:inherit;cursor:pointer}
  select:focus{outline:2px solid var(--blue);outline-offset:1px}
  button.ghost:hover{border-color:var(--blue);color:#7fb0ff}
  .fnote{color:var(--dim);font-size:12px;margin-left:auto;max-width:340px}

  .panel{display:none}.panel.active{display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
              padding:14px 15px 8px;margin-bottom:16px}
  .chart-card h3{margin:0 0 3px;font-size:15px;font-weight:650}
  .chart-card .sub{margin:0 0 10px;color:var(--muted);font-size:12.5px}
  .chart{width:100%;height:330px}
  .chart.tall{height:430px}
  .lead{background:linear-gradient(135deg,#16233f,#1a2c50);border-left:3px solid var(--blue)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card2);
     font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:var(--card2)}
  .tbl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
            padding:6px 4px;max-height:430px;overflow:auto;margin-bottom:16px}

  .state{border:1px dashed var(--line);border-radius:var(--radius);padding:34px 22px;
         text-align:center;color:var(--muted);background:var(--card)}
  .state h4{margin:0 0 6px;color:var(--ink);font-size:15px}
  .state code{background:#0a1120;padding:2px 7px;border-radius:6px;font-size:12.5px;color:#9fc4ff}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);
           border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:26px;text-align:center;color:var(--dim);font-size:13.5px}
  #errorState{display:none}

  footer{color:var(--dim);font-size:12px;padding:16px 24px 30px;border-top:1px solid var(--line);
         max-width:1280px;margin:0 auto}
  footer a{color:var(--blue)}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:12px;top:12px;background:var(--blue);color:#fff;padding:8px 12px;border-radius:8px;z-index:99}

  @media(max-width:900px){
    .grid2{grid-template-columns:1fr}
    .chart{height:280px}.chart.tall{height:340px}
    .wrap,header{padding-left:14px;padding-right:14px}
    .fnote{margin-left:0}
    [data-tip]:hover::after{width:210px}
  }
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<header>
  <div class="hrow">
    <div>
      <h1 class="brand">Ingo<span>Mobility</span></h1>
      <div class="tagline" data-i18n="tagline"></div>
    </div>
    <div class="langswitch" role="group" aria-label="Language">
      <button id="langEn" data-lang="en" aria-pressed="true">EN</button>
      <button id="langDe" data-lang="de" aria-pressed="false">DE</button>
    </div>
  </div>
  <div class="provenance" id="provenance"></div>
</header>

<div class="wrap" id="main">
  <div id="loadingState" class="state">
    <div class="spinner"></div>
    <h4 data-i18n="loadingTitle"></h4>
    <div data-i18n="loadingBody"></div>
  </div>

  <div id="errorState" class="state">
    <h4 data-i18n="errorTitle"></h4>
    <p data-i18n="errorIntro"></p>
    <p style="text-align:left;max-width:520px;margin:14px auto;" data-i18n="errorSteps"></p>
    <p class="empty" data-i18n="errorFile"></p>
    <button class="ghost" onclick="boot()" data-i18n="retry"></button>
  </div>

  <div id="app" style="display:none">
    <div class="kpis" id="kpis"></div>

    <nav class="tabs" id="tabs" role="tablist">
      <button data-tab="overview" class="active" data-i18n="tabOverview"></button>
      <button data-tab="traffic" data-i18n="tabTraffic"></button>
      <button data-tab="forecast" data-i18n="tabForecast"></button>
      <button data-tab="transit" data-i18n="tabTransit"></button>
      <button data-tab="charging" data-i18n="tabCharging"></button>
    </nav>

    <div class="filters" id="filters">
      <div class="fgroup">
        <label for="fDistrict" data-i18n="filterDistrict"></label>
        <select id="fDistrict"></select>
      </div>
      <div class="fgroup">
        <label for="fRoad" data-i18n="filterRoad"></label>
        <select id="fRoad"></select>
      </div>
      <div class="fgroup">
        <label for="fDay" data-i18n="filterDay"></label>
        <select id="fDay"></select>
      </div>
      <button class="ghost" id="fReset" data-i18n="filterReset"></button>
      <div class="fnote" id="filterNote"></div>
    </div>

    <section class="panel active" id="tab-overview" role="tabpanel">
      <div class="chart-card lead">
        <h3 data-i18n="ovTitle"></h3>
        <p class="sub" data-i18n="ovSub"></p>
        <div class="grid2">
          <div class="chart-card" style="margin:0">
            <h3 data-i18n="ovForecastTitle"></h3>
            <p class="sub" id="ovForecast"></p>
          </div>
          <div class="chart-card" style="margin:0">
            <h3 data-i18n="ovTransitTitle"></h3>
            <p class="sub" id="ovTransit"></p>
          </div>
        </div>
        <div class="chart-card" style="margin:16px 0 0">
          <h3 data-i18n="ovSitingTitle"></h3>
          <p class="sub" id="ovSiting"></p>
        </div>
      </div>
      <div class="chart-card">
        <h3 data-i18n="ladderTitle"></h3>
        <p class="sub" data-i18n="ladderSub"></p>
        <div class="chart" id="c_ladder"></div>
      </div>
    </section>

    <section class="panel" id="tab-traffic" role="tabpanel">
      <div class="chart-card">
        <h3 data-i18n="busyTitle"></h3>
        <p class="sub" data-i18n="busySub"></p>
        <div class="chart" id="c_hourly"></div>
      </div>
      <div class="grid2">
        <div class="chart-card">
          <h3 data-i18n="roadTitle"></h3>
          <p class="sub" data-i18n="roadSub"></p>
          <div class="chart" id="c_roadtype"></div>
        </div>
        <div class="chart-card">
          <h3 data-i18n="dailyTitle"></h3>
          <p class="sub" data-i18n="dailySub"></p>
          <div class="chart" id="c_daily"></div>
        </div>
      </div>
      <div class="chart-card">
        <h3 data-i18n="districtTitle"></h3>
        <p class="sub" data-i18n="districtSub"></p>
        <div class="chart" id="c_district"></div>
      </div>
      <div class="tbl-card"><table id="t_district"></table></div>
    </section>

    <section class="panel" id="tab-forecast" role="tabpanel">
      <div class="kpis" id="fc_kpis" style="margin-bottom:16px"></div>
      <div class="chart-card">
        <h3 data-i18n="fcTitle"></h3>
        <p class="sub" data-i18n="fcSub"></p>
        <div class="chart tall" id="c_forecast"></div>
      </div>
      <div class="grid2">
        <div class="chart-card">
          <h3 data-i18n="impTitle"></h3>
          <p class="sub" data-i18n="impSub"></p>
          <div class="chart" id="c_importance"></div>
        </div>
        <div class="chart-card">
          <h3 data-i18n="foldTitle"></h3>
          <p class="sub" data-i18n="foldSub"></p>
          <div class="chart" id="c_folds"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="tab-transit" role="tabpanel">
      <div class="grid2">
        <div class="chart-card">
          <h3 data-i18n="headwayTitle"></h3>
          <p class="sub" data-i18n="headwaySub"></p>
          <div class="chart" id="c_headway"></div>
        </div>
        <div class="chart-card">
          <h3 data-i18n="tripsTitle"></h3>
          <p class="sub" data-i18n="tripsSub"></p>
          <div class="chart" id="c_trips"></div>
        </div>
      </div>
      <h3 style="font-size:15px;margin:4px 0 8px" data-i18n="lineDetail"></h3>
      <div class="tbl-card"><table id="t_routes"></table></div>
      <h3 style="font-size:15px;margin:4px 0 8px" data-i18n="weakStops"></h3>
      <div class="tbl-card"><table id="t_stops"></table></div>
    </section>

    <section class="panel" id="tab-charging" role="tabpanel">
      <div class="chart-card">
        <h3 data-i18n="mapTitle"></h3>
        <p class="sub" data-i18n="mapSub"></p>
        <div class="chart tall" id="c_map"></div>
      </div>
      <h3 style="font-size:15px;margin:4px 0 8px" data-i18n="rankedTitle"></h3>
      <div class="tbl-card"><table id="t_siting"></table></div>
    </section>
  </div>
</div>

<footer id="footer"></footer>

const FEATURE_LABELS = {
  en:{hour_sin:'Hour of day (sine)', hour_cos:'Hour of day (cosine)',
      lag_24:'Same hour yesterday', lag_168:'Same hour last week',
      roll_mean_24:'Average of last 24 h', roll_std_24:'Variability of last 24 h',

      dow:'Wochentag', month:'Monat', temp_c:'Temperatur', precip_mm:'Niederschlag'}

function featLabel(name){
  const map = FEATURE_LABELS[LANG] || FEATURE_LABELS.en;
  if(map[name]) return map[name];
  if(name.startsWith('road_type_')) return t('roadTypePrefix') + ': ' + rt(name.slice(10));
  if(name.startsWith('detector_id_')) return t('detector') + ' ' + name.slice(12);
  return name;
}

const GLOSSARY = {avg_daily_traffic_citywide:'g_traffic', forecast_mae:'g_mae', forecast_r2:'g_r2',
  baseline_mae:'g_base', calendar_only_mae:'g_cal', lift_over_calendar_pct:'g_lift',
  avg_peak_headway_min:'g_headway', n_underserved_stops:'g_under', n_charging_points:'g_points'};

function tip(key){
  const k = GLOSSARY[key];
  const txt = k ? t(k) : ((DATA && DATA.glossary) ? DATA.glossary[key] : null);
  return txt ? `<span class="info" data-tip="${txt.replace(/"/g,'&quot;')}">i</span>` : '';
}
function kpi(value, label, cls, key){
  return `<div class="kpi"><div class="v ${cls||''}">${value}</div>
          <div class="l">${label}${tip(key)}</div></div>`;
}
function emptyInto(id, msg){ const el=g(id); if(el) el.innerHTML = `<div class="empty">${msg}</div>`; }
function table(id, head, rows, emptyMsg){
  const el = g(id);
  if(!rows.length){ el.innerHTML = `<tr><td class="empty">${emptyMsg||t('noRows')}</td></tr>`; return; }
  el.innerHTML = '<thead><tr>' + head.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>'
    + rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('') + '</tbody>';
}
function plot(id, traces, layout){
  if(!traces.length || traces.every(tr => !(tr.x||tr.lat||[]).length)){ emptyInto(id, t('noData')); return; }
  Plotly.newPlot(id, traces, {...LAYOUT, ...layout}, CFG);
}

    .sort((a,b)=>a.departures_weekday-b.departures_weekday).slice(0,12);
  table('t_stops',[t('thStop'),t('thDistrict'),t('thWeekdayDepShort'),t('thSundayDep')],
    weak.map(s=>[s.stop_name,s.district,s.departures_weekday,
      s.departures_sunday===0?`<span style="color:#f7c069">${t('thNone')}</span>`:s.departures_sunday]),
    t('noStops'));
}
function renderCharging(){
  const det=DATA.detectors.filter(d=>(!state.district||d.district===state.district)&&
                                     (!state.road||d.road_type===state.road));
  const ch=DATA.charging_stations.filter(c=>!state.district||c.district===state.district);
  const rec=(DATA.siting.summary&&DATA.siting.summary.recommendations)||[];
  const recF=rec.filter(r=>!state.district||r.nearest_district===state.district);
  const traces=[];
  [...new Set(det.map(d=>d.road_type))].forEach(ty=>{
    const rows=det.filter(d=>d.road_type===ty);
    traces.push({type:'scattermapbox',lat:rows.map(d=>d.lat),lon:rows.map(d=>d.lon),
      name:t('detector')+' · '+rt(ty),mode:'markers',marker:{size:9,color:ROAD_COLORS[ty]||'#93a4c4'},
      text:rows.map(d=>d.detector_name),hovertemplate:'%{text}<extra>'+t('trafficDetector')+'</extra>'});});
  traces.push({type:'scattermapbox',lat:ch.map(d=>d.lat),lon:ch.map(d=>d.lon),name:t('existingCharging'),
    mode:'markers',marker:{size:9,color:'#22d3ee'},
    text:ch.map(d=>`${d.station_name} · ${d.num_points}× ${d.power_kw} kW`),
    hovertemplate:'%{text}<extra>'+t('chargingStation')+'</extra>'});
  // Numbered red circles: scattermapbox ignores marker symbols on raster tile
  // styles such as open-street-map, which previously left these invisible.
  traces.push({type:'scattermapbox',lat:recF.map(d=>d.lat),lon:recF.map(d=>d.lon),
    name:t('recommendedSite'),mode:'markers+text',
    marker:{size:26,color:'#ef4444',opacity:0.95},
    text:recF.map(d=>String(d.rank)),textposition:'middle center',
    textfont:{color:'#ffffff',size:13,family:'-apple-system,Segoe UI,Roboto,sans-serif'},
    hovertext:recF.map(d=>`${t('rank')} ${d.rank} · ${d.nearest_district} · ${t('unmetDemand')} ${d.gap_score}`),
    hovertemplate:'%{hovertext}<extra>'+t('recommendation')+'</extra>'});
  plot('c_map',traces,{margin:{l:0,r:0,t:0,b:0},
    mapbox:{style:'open-street-map',center:{lat:48.7665,lon:11.4258},zoom:11.1},
    legend:{bgcolor:'rgba(19,30,53,.85)',bordercolor:'#26364f',borderwidth:1,
            y:0.98,x:0.01,orientation:'v',font:{size:11}}});

  table('t_siting',[t('thRank'),t('thNearest'),t('thGap'),t('thDemand'),t('thSupply'),t('thCoords')],
    recF.map(d=>[d.rank,d.nearest_district,d.gap_score,d.demand,d.supply,
      `${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}`]),
    t('noSites'));
}

const RENDER={overview:renderOverview,traffic:renderTraffic,forecast:renderForecast,
              transit:renderTransit,charging:renderCharging};

function show(tab){
  state.tab=tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+tab));
  g('filters').style.display = (tab==='forecast'||tab==='overview') ? 'none' : 'flex';
  RENDER[tab]();
  drawn[tab]=true;
  document.querySelectorAll('#tab-'+tab+' .chart').forEach(c=>{ if(c.data) Plotly.Plots.resize(c); });
}
function refresh(){ updateFilterNote(); RENDER[state.tab](); }

function applyStaticText(){
  document.documentElement.lang = I18N[LANG].htmlLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = t(el.getAttribute('data-i18n'));
    if(typeof v === 'string') el.textContent = v;
  });
  const districts = (DATA&&DATA.filters?DATA.filters.districts:[]);
  const roads = (DATA&&DATA.filters?DATA.filters.road_types:[]);
  const selD = g('fDistrict');
  if(selD){ const cur=selD.value;
    selD.innerHTML = `<option value="">${t('allDistricts')}</option>`
      + districts.map(d=>`<option value="${d}">${d}</option>`).join('');
    selD.value=cur; }
  const selR = g('fRoad');
  if(selR){ const cur=selR.value;
    selR.innerHTML = `<option value="">${t('allRoads')}</option>`
      + roads.map(d=>`<option value="${d}">${rt(d)}</option>`).join('');
    selR.value=cur; }
  const day=g('fDay');
  if(day){ const cur=day.value;
    day.innerHTML = `<option value="">${t('allDays')}</option>`
      + `<option value="weekday">${t('weekdaysOnly')}</option>`
      + `<option value="weekend">${t('weekendsOnly')}</option>`;
    day.value=cur; }
  g('langEn').setAttribute('aria-pressed', String(LANG==='en'));
  g('langDe').setAttribute('aria-pressed', String(LANG==='de'));
}
function setLang(lang){
  if(lang===LANG) return;
  LANG = lang;
  try { localStorage.setItem('ingomob_lang', lang); } catch(e){ /* private mode */ }
  FMT = new Intl.NumberFormat(I18N[LANG].locale);
  applyStaticText();
  if(!DATA) return;
  renderProvenance(); renderKpis(); updateFilterNote(); renderFooter();
  Object.keys(drawn).forEach(k=>delete drawn[k]);
  show(state.tab);
}
function renderFooter(){
  const m = DATA.meta;
  const detail = m.source_mode==='demo' ? t('srcDemoDetail') : t('srcLiveDetail');
  g('footer').innerHTML = `${detail} · ${t('footerPortal')}:
    <a href="https://ingolstadt.bydata.de" target="_blank" rel="noopener">ingolstadt.bydata.de</a>
    · ${t('footerWeather')}: <a href="https://opendata.dwd.de" target="_blank" rel="noopener">DWD Open Data</a>
    · ${t('footerTransit')}: <a href="https://www.vgi.de" target="_blank" rel="noopener">VGI</a>`;
}

async function boot(){
  applyStaticText();
  g('loadingState').style.display='block';
  g('errorState').style.display='none';
  g('app').style.display='none';
  try{
    const res=await fetch('./data.json',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA=await res.json();
    if(!DATA || !DATA.kpis) throw new Error('malformed payload');
  }catch(e){
    g('loadingState').style.display='none';
    g('errorState').style.display='block';
    return;
  }
  g('loadingState').style.display='none';
  g('app').style.display='block';
  applyStaticText();
  renderProvenance(); renderKpis(); updateFilterNote(); renderFooter();

  g('fDistrict').onchange=e=>{state.district=e.target.value;refresh();};
  g('fRoad').onchange=e=>{state.road=e.target.value;refresh();};
  g('fDay').onchange=e=>{state.day=e.target.value;refresh();};
  g('fReset').onclick=()=>{state.district=state.road=state.day='';
    g('fDistrict').value='';g('fRoad').value='';g('fDay').value='';refresh();};
  g('tabs').addEventListener('click',e=>{ if(e.target.dataset.tab) show(e.target.dataset.tab); });
  g('langEn').onclick=()=>setLang('en');
  g('langDe').onclick=()=>setLang('de');

  show('overview');
  window.addEventListener('resize',()=>{
    document.querySelectorAll('.panel.active .chart').forEach(c=>{ if(c.data) Plotly.Plots.resize(c); });
  });
}
boot();
</script>
</body>
</html>
